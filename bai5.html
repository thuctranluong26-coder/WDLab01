<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5 - Image + Text Demonstration</title>
</head>
<body>

    <main>
        <h1>ẨM THỰC VÀ DU LỊCH VIỆT NAM</h1>

        <!-- Khối thứ nhất: Bún bò -->
        <section>
            <figure>
                <img src="images/bunbo.jpg" alt="Tô Bún bò Huế đặc sản thơm ngon" width="220" align="left" hspace="15">
                <figcaption>
                    <h3>Bún Bò Huế</h3>
                    <p>
                        Bún bò là một trong những món ăn đặc sản nổi tiếng của ẩm thực Việt Nam. Món ăn hấp dẫn bởi nước dùng đậm đà thơm mùi sả, mắm ruốc cùng thịt bò mềm và chả quết tinh tế. Đây là niềm tự hào của văn hóa ẩm thực miền Trung nói riêng và Việt Nam nói chung.
                    </p>
                </figcaption>
            </figure>
        </section>

        <!-- Xóa float để khối sau xuống dòng sạch mượt -->
        <br clear="all">
        <br>

        <!-- Khối thứ hai: Hội An -->
        <section>
            <figure>
                <img src="images/hoian.jpg" alt="Phố cổ Hội An rực rỡ đèn lồng" width="220" align="left" hspace="15">
                <figcaption>
                    <h3>Phố Cổ Hội An</h3>
                    <p>
                        Hội An là một đô thị cổ nằm ở hạ lưu sông Thu Bồn, thuộc tỉnh Quảng Nam. Nơi đây nổi tiếng với những ngôi nhà cổ mái ngói rêu phong, không gian đèn lồng rực rỡ và nền văn hóa di sản phong phú, thu hút hàng triệu du khách trong và ngoài nước mỗi năm.
                    </p>
                </figcaption>
            </figure>
        </section>
    </main>

    <br clear="all">
    <!-- Link quay lại trang chính index -->
    <p><a href="index.html">← Back to Main Page</a></p>

</body>
</html>
